:"Mythos Will of Cthulhu Platoon",advantage:"All Required Units in the Platoon, as well as any Cultist Fire Squad (and Heroes Joined) or Mi-Go Squad (including Heroes Joined) in Support of this Platoon are immune to all friendly Spores Weapons. In addition, they are immune to friendly Psychic Scream or Psychic Vortex Skills. If they are ever in Range of these attacks, used by friendly Units, the Required Units and relevant Support Units simply ignore the effects of these Skills.",lore:"Will of Cthulhu",onlyCombatUnitsAsSupport:!1,command:[[["mythos--lilith"]],[["mythos--lilith-possessed"]]],combat:[[["mythos--cultist-fire-squad"]],[["mythos--mi-go-assault-squad"]]],image:"mythos_will_of_cthulhu_platoon"},{id:"mythos--mythos-monstrous-creatures-platoon",bloc:"Mythos",name:"Mythos Monstrous Creatures Platoon",advantage:`Units with the Mythos Creature Skill in or supporting this Platoon can never be the target of a Sustained Attack. If an enemy Unit is attacking several targets, the enemy Unit can use its Weapons targeting other Units with Sustained Attacks (spending two actions as usual) but any Weapons targeting Mythos Creatures count as one regular Attack instead. 
          Special : this Platoon advantage is lost if the Avatar leading the Platoon is destroyed.`,lore:"Unspeakable Fear",onlyCombatUnitsAsSupport:!1,command:[[["mythos--avatar-of-nyarlathotep"],["mythos--avatar-of-cthulhu"]]],combat:[[["mythos--spawn-of-cthulhu"],["mythos--spawn-of-cthulhu-alt"]],[["mythos--spawn-of-cthulhu"],["mythos--spawn-of-cthulhu-alt"]]],image:"Mythos_MonstrousCreatures"},{id:"mythos--mythos-strike-from-the-shadows-platoon",bloc:"Mythos",name:"Mythos Strike From The Shadows Platoon",advantage:"The Platoon's Command Unit, Ekaterina and Sabertooth Joined to a Cultist Saboteur Squad, gain the Spy Skill.",lore:"Strike From The shadows",onlyCombatUnitsAsSupport:!1,command:[[["mythos--ekaterina-and-sabertooth"]],[["mythos--cultist-saboteur-squad"]]],combat:[[["mythos--cultist-saboteur-squad"]],[["mythos--cultist-saboteur-squad"]]],image:"mythos_strike_from_the_shadows_platoon"},{id:"ijn--shadow-of-death-ninja-platoon",bloc:"IJN",name:"Shadow of Death Ninja Platoon",advantage:"If a friendly Ninja Infantry Unit (Squad or Hero, as long as it has the word Ninja in its name) in or supporting this Platoon controls an Objective, it can never be contested by an enemy Unit. Ninja Units can contest an Objective, but when they are part of this Platoon, theirs can never be contested. Your opponent will have to \u201Cremove\u201D them permanently from the Objective to be able to capture and even contest it.",lore:"The Mission Is Sacred",onlyCombatUnitsAsSupport:!1,command:[[["ijn--shadow-of-death"]]],combat:[[["ijn--ninja-infiltration-squad"]],[["ijn--tengu"]]],image:"weng_si_platoon"},{id:"ijn--shadow-of-the-serpent-ninja-platoon",bloc:"IJN",name:"Shadow of the Serpent Ninja Platoon",advantage:"All Ninja Infantry Units do not lose their Improved Camouflage if they execute a March Move. These Units must be Camouflaged before the March Move and can start the game with a March Move and still be Camouflaged.",lore:"Silent but deadly",onlyCombatUnitsAsSupport:!1,command:[[["ijn--shadow-of-the-serpent"]]],combat:[[["ijn--ninja-execution-squad"]],[["ijn--ninja-execution-squad"]],[["ijn--tengu"]]],image:"Shadow-of-the-Serpent-Platoon"},{id:"ijn--smoke-dragon-platoon",bloc:"IJN",name:"Smoke Dragon Platoon",advantage:"Genbu Type 113 Medium Artillery Walkers in or supporting this Platoon can re-roll the dice once when using their Artillery weapon to fire a Smoke shell. This Platoon advantage only works if there's a least one Ninja Observer Team still on the battlefield.",lore:"The Smoke Dragon",onlyCombatUnitsAsSupport:!1,command:[[["ijn--genbu"]]],combat:[[["ijn--ninja-observer-team"]],[["ijn--ninja-observer-team"]],[["ijn--ninja-sniper-team"]]],image:"Smoke-Dragon-Platoon"},{id:"ijn--cadet-combat-platoon",bloc:"IJN",name:"Cadet Combat Platoon",advantage:"All Naval Academy Cadets, or Units with the IJN Cadet title in their name, in or supporting this Platoon that are the target of a succesfull Get moving You Bunch Of Monkeys Special Action immediately remove any Under Fire or Suppression token they might have.",lore:"Unflinching Loyalty",onlyCombatUnitsAsSupport:!1,command:[[["ijn--command-squad"]]],combat:[[["ijn--kill-squad"]],[["ijn--kill-squad"]],[["ijn--railgun-team"]]],image:"Cadet-Combat-Platoon"},{id:"ijn--cadet-support-platoon",bloc:"IJN",name:"Cadet Support Platoon",advantage:"All Kill Squad Naval Academy Cadets in or supporting this Platoon gain the ability to perform the Makeshift Repair Special Action. These can only target Enenra, Basan or Genbu walkers in or supporting the Cadet Support Platoon. These Kill Squads Naval Academy Cadets also gain Expert on all their Weapons while they are adjacent to the type of Walker Units mentioned above, in or Supporting this Platoon.",lore:"Respect and Cooperation",onlyCombatUnitsAsSupport:!0,command:[[["ijn--enenra"],["ijn--genbu"],["ijn--basan"]]],combat:[[["ijn--enenra"],["ijn--genbu"],["ijn--basan"]],[["ijn--kill-squad"]]],image:"Cadet-Support-Platoon"},{id:"ijn--kamikaze-walker-platoon",bloc:"IJN",name:"Kamikaze Walker Platoon",advantage:"Any IJN Walker Unit with Vehicle Armor Value of 4 or 5 in or Supporting this Platoon can declare a Kamikaze Assault. It means this Walker gains a free Attack Action after it executes a March Move. Until the start of this Unit's next Activation, it is considered as having one less Vehicle Armor Value.",lore:"Kamikaze Walker Assault",onlyCombatUnitsAsSupport:!1,command:[[["ijn--enenra"],["ijn--genbu"],["ijn--basan"],["ijn--tengu"],["ijn--ryu"],["ijn--ryu-ii"],["ijn--ryu-iii"]]],combat:[[["ijn--enenra"],["ijn--genbu"],["ijn--basan"],["ijn--tengu"],["ijn--ryu"],["ijn--ryu-ii"],["ijn--ryu-iii"]],[["ijn--enenra"],["ijn--genbu"],["ijn--basan"],["ijn--tengu"],["ijn--ryu"],["ijn--ryu-ii"],["ijn--ryu-iii"]]],image:"kamikaze-walker-platoon"}]};var Kg={"Ace Air Pilot":"May mount an Aircraft, using his skills while mounted. Roll one die when Aircraft Activates, gaining a third action on a dice_block or a dice_sight for this activation. Not shared with Unit joined.","Ace Gunner":"Any Vehicle this Hero pilots gains Expert on all Weapons.","Ace Pilot":"May mount a Vehicle, using his skills while mounted. Roll one die when Vehicle Activates, gaining a third action on a dice_block or a dice_sight for this activation. Not shared with Unit joined.","Advanced Reactive Fire":"Can attempt a Reactive Attack at up to Range 6, counting dice_shield as dice_block when rolling for number of Actions.","Air Alert":"Take Air Alert Special Action to select an enemy Aircraft in Line of Sight, and roll a die. On a dice_block, friendly Vehicles attacking it hit on dice_sight as well as dice_block for the remainder of the Turn.","Air Assault":"Can be carried by an Airlifter and can Activate after the Airlifter carrying it, to dismount and Move or March Move as its first Action. In addition, if the Aircraft carrying the Air Assault Vehicle is eliminated, it only takes Damage on rolls of dice_sight rather than dice_sight or dice_shield.","Air Pilot":"May pilot an Aircraft, using his skills while in the Aircraft. Does not apply to Unit Joined.","Air Traffic Control":"Select a friendly Aircraft that has already been activated this turn, and roll a die ; on a result of dice_block the selected Aircraft activates again. With a successfull Air Traffic Control Special Action, the player Activates two units consecutively. A unit may only be Reactivated once per turn.",Airborne:"An Airborne Unit is never placed in the play area at the start of the game. On the first Turn of the game (if held in Reserve, when they would normally be put into play) they are placed anywhere on play area, but not within Range 2 of any Objective. The Airborne Unit can be placed inside Terrain that blocks or impairs Line of Sight. Airborne Infantry can also be placed on top of a Building (but not inside). The Unit first Action must be a Nothing Action. The player then rolls a die. On a roll of dice_block or dice_sight , the player may assign the Unit\u2019s second Action. On a roll of dice_shield the Unit must perform a second Nothing Action. An Airborne Unit may not capture nor contest an Objective on the Turn it is placed. Not shared with Unit joined.",Airlifter:"Can only carry Air Assault or Airmobile Vehicles.",Airmobile:"Can be carried by an Airlifter.","Ammo Drop":"Action sp\xE9ciale d'officier : lancer 1 d\xE9, r\xE9ussite sur dice_block ou dice_sight. L'unit\xE9 au sol choisie (ligne de vue, port\xE9e 2 ; avec radio : n'importe o\xF9) retrouve toutes ses munitions limit\xE9es. (p.146)","Ammo Dump":"All Ground Units adjacent to this one can Reload as a Free Action.","Ammo Supply":"Once per game, perform an Ammo Supply Special Action to re-supply all Limited Ammo Weapons for friendly Ground Units on the battlefield.",Amphibious:"Can enter and move through Water and Swamp as if it were Open Terrain.","And Stay Down":"Any Unit Hit by ranged weapons fired by this Unit automatically gains a Suppression token if it does not already have one. Not shared with Unit Joined.",Artillery:"Arme d'artillerie (port\xE9e min\u2013max, tir en cloche). Vise un point dans l'arc de tir, \xE0 port\xE9e et en ligne de vue (ou via un observateur d'artillerie). Sur quadrillage, zone de 2\xD72 carr\xE9s ; on lance les d\xE9s pour chaque unit\xE9 de la zone, amie ou ennemie. L'infanterie \xE0 d\xE9couvert n'a pas de sauvegarde d'infanterie. Peut tirer un \xE9cran de fum\xE9e \xE0 la place. (R\xE8gles p.154)","Artillery Barrage":"Barrage d'artillerie : voir la carte de l'unit\xE9 et les r\xE8gles d'artillerie (p.154).","Artillery Observer":"As long as the miniature modeled with the Radio is in play, this Unit may use the Artillery Weapons of a friendly Unit that has not yet activated when performing an Attack or Sustained Attack Action. The Artillery Unit immediately activates and consequently performs an Attack, Sustained Attack, or fires Smoke with its Artillery Weapons. The Artillery Unit uses the Artillery Observer to determine Line of Sight but checks its Field of Fire and Range as normal. The Artillery Unit may perform a Reload Action before or after the Attack Action if the Artillery Observer has an Action to do so. Once the Artillery Unit finishes its Activation, the Artillery Observer continues its Activation.",Assassin:"Choose which enemy Soldiers are assigned hits when performing an Attack action with Close-Combat Weapons. Not shared with Unit Joined.","Assault Shield":"An Assault Shield is an equipment that gives access to the Skill of the same name, carried by the Unit Leader of the Squad. You can elect to assign him hits during a Close-Combat Attack. When a hit is assigned to a miniature with an Assault Shield, roll a die. On a dice_block, cancel the hit. If the Assault Shield roll fails, the Leader is lost, and so is his Assault Shield.","Assault Vehicle":"Passengers in this Vehicle (or Aircraft) can disembark after the Vehicle (or Aircraft) has Activated in the current Turn.","At The Double":"A Unit with this skill (and any unit it has joined or Hero that has joined it) may perform a free Move Action after performing a March Move Action.",Berserk:"When a Hero with this Skill scores hits with Close-Combat Weapons, roll again and add additional hits on dice_block results. Roll hits until unsuccesful. If the Hero has a special rule that allows it to Hit on a roll of dice_sight as well as dice_block , rolls of dice_sight only counts as Hits for the first roll. Additional rolls only Hit on a result of dice_block. Not shared with Unit joined.","Black Ops":"If your force has a Hero with this Skill, roll four dice for initiative rolls.",Blutkreuz:"All Mindless Zombie Units within range 1 of the Hero possessing this Skill at the start of their activation increase their Move to 3, their March Move to 4, and gain the Charge Skill. Not shared with Unit joined.","Bombing Run":"Bombardement a\xE9rien : voir la carte de l'unit\xE9 et les r\xE8gles d'a\xE9ronefs.",Brave:"Roll three dice when rolling to remove Under Fire or Suppression tokens.",Camouflage:"May take Camouflage Special Action. Once it is Camouflaged, this Unit cannot be attacked at Range 3 or higher. This benefit ends if Unit takes any Action other than a Move or Nothing Action (Artillery Observers can use their Skill to attack with an Artillery Unit as well). Starts the game Camouflaged. Not shared with Unit Joined.",Charge:"A unit with the Charge Skill (and any Unit it has joined or Hero that has joined it) may perform a free Attack Action using Close-Combat Weapons immediately after performing a March Move Action.","Cheat Death":"If eliminated, roll a die after resolving the Attack that eliminated the Hero. On a dice_block or dice_shield, the Hero removes one point of Damage and survives, but gains a Stunned token. A Unit with a Stunned token cannot fight, including a Retaliatory Attack in Close Combat. Unit must perform a Nothing Action as its first Action next Activation, removing all Stunned tokens. A Stunned Unit rolls only one dice for a Reactive Attack, but removes Stunned tokens. A unit both Supressed and Stunned only loses a single Action.A Hero can only Cheat Death once per game.",Clone:"Several copies of the same Hero can be deployed.","Combat Medic":"Can use the Medic Special Actions like a Command Squad Medic.","Command Squad":"May perform Special Actions with its Officer, Medic, or Mechanic to reactivate, heal, repair, or rearm Units, as long as the corresponding miniature (Officer, Medic, Engineer) is in play.","Command Vehicle":"Officers, Mechanics and Medics mounted in Command Vehicle can re-roll failed Command Squad Special Actions.",Commissar:"Joins an Infantry Unit (Squad or Hero) for the duration of the game. A Unit with a Commissar rolls three dice instead of two when rolling to remove Under Fire or Supression tokens. Each Unit may only have one Commissar attached to it. Commissars must have the same Armor rating as Unit joined. If a Unit is returned to the game for any reason, any Commissar Joined returns with them. A squad from a specific Faction Joined by a Commissar is always considered belonging to the same Faction.","Critical Repairs":"When this Unit performs a Makeshift Repair, it also removes one Critical Hit effect.","Cultist Command Squad":"May perform Special Actions with its Officer, Medic or Mechanic on Cultist Units.",Cutting:"Arme tranchante : chaque touche fait relancer le d\xE9, nouvelle touche sur dice_block, et ainsi de suite jusqu'\xE0 un rat\xE9. Un v\xE9hicule \xE9quip\xE9 peut faire des actions sp\xE9ciales du g\xE9nie. (p.155)","Damage Resilient":"Roll one die for each point of Damage the Unit Takes, negating one point for each dice_block rolled. Does not apply to Units Joined.","Dazzling Speed":'Always passes Infantry Saves on dice_shield as well as dice_block. Roll one die for each point of Damage the Unit takes in Close Combat, negating one point for each dice_block rolled. Skill shared only with Units that have the "Cadet" title on their Unit Card.',"Defensive Pilot":"May mount a Vehicle, using their skills while in the Vehicle. If the Vehicle moves during the Turn, it gains a Cover Save until its next Activation.","Defensive Tactics":"Gains Damage Resilient skill when in Cover. Benefit still applies against weapons that negates Cover (including Close-Combat Attacks).","Desert Fox":"Any Unit reactivated by Rommel using Get Moving You Bunch of Monkeys gains the At The Double Skill for that Activation.",Devour:"Each time this Hero inflicts one point of Damage in Close Combat, she heals one Health. A Unit can't have more Health than the maximum written on its Unit's card. Since Close Combat is simultaneous (except against First Strike), a Unit with Devour can heal itself while taking Damage.","Dozer Blade":"Take a Dozer Special Action to gain a Cover Save until the Vehicle takes a Move or March Move Action. A Vehicle with a Dozer Blade can also perform Engineering Special Actions.","Drive By Shooting":"The Unit can execute an Attack action with its Weapons, on one side only, after taking a March Move Action.","Engineer Vehicle":"Take an Engineering Special Action to destroy fortifications and obstacles.",Exalted:"Can Join a Unit with the Lesser Mythos Creature Skill.",Execute:"Can take Execute Special Action to choose and eliminate a soldier that is part of a Unit with a Stunned token (including a Hero) within Range 1.",Expert:"Expert (arme) : touche sur dice_block et dice_sight en attaque ou attaque soutenue avec l'arme indiqu\xE9e. Jamais partag\xE9 avec l'unit\xE9 rejointe. (p.166 + FAQ)",Explode:"Never becomes a Wreck. If destroyed, any unit within range 2 is hit by a attack_b/1 Attack. Line of Sight and Cover apply.",Fanatical:"Unit is immune to Supression. Applies when piloting a vehicule.","Fighting Spirit":"Once per game, a Unit with Fighting Spirit (and any Unit it has Joined or Hero that has Joined it) hits on dice_sight as well as dice_block when making an Attack or Sustained Attack Action.","First Strike":"Resolves all Close-Combat Attacks and applies the results before the target resolves theirs. First Strike takes effect regardless of whether the Unit initiated the Close Combat Attack or is retaliating. If one Unit with the First Strike Skill Attacks another Unit with the First Strike skill, both Units ignore this Skill. If a First Strike Attack places a Stun Token on a target Unit without First Strike, the Stunned Unit can't retaliate. Does not apply to Unit Joined.",Flame:"Lance-flammes : les unit\xE9s touch\xE9es re\xE7oivent un marqueur suppression et n'ont ni sauvegarde d'infanterie ni de couvert. Sur quadrillage, touche toutes les unit\xE9s (amies comprises) sur le chemin le plus court jusqu'\xE0 la cible. (p.156 + errata)","Flame Burst":"Explosion de flammes : marqueur suppression, ni sauvegarde d'infanterie ni de couvert. Gabarit de souffle ; sur quadrillage, toutes les unit\xE9s au sol du carr\xE9 cibl\xE9. (p.158)",Flying:"Unit can pass over any Terrain as if it was Open Terrain, provided that it ends its Move or March move in terrain that it could normally occupy. If a Hero has Joined a Unit, both must possess the Flying Skill for either to use it when they activate together.","Follow Me":"Can take a Follow Me Special Action once per Turn. All friendly infantry units with infantry armour 1 or 2 within range 2 and in Line of Sight roll a die. On a dice_block they take an immediate Move action with a move rating of 2.",General:"A Hero with this Skill may take a Free Officer Special Action each time they activate and, if Joined to a Unit with an Officer, roll two dice when attempting Officer Special Actions.","Get up, It Ain't That Bad":"Action sp\xE9ciale de m\xE9decin : 1 d\xE9, r\xE9ussite sur dice_block ou dice_sight. Une unit\xE9 d'infanterie en ligne de vue \xE0 port\xE9e 1 (soi-m\xEAme inclus) r\xE9cup\xE8re une figurine \xE9limin\xE9e, ou 1 point de d\xE9g\xE2t pour un hero/arme de soutien. Ne change pas les munitions limit\xE9es. (p.147)",Gorilla:"Only a Gorilla Hero may join a Gorilla Unit. Gorilla Heroes cannot Join Units that are not Gorillas.",Grapple:"Pinces : une touche place un marqueur \xE9tourdi ; la cible ne peut ni bouger ni marcher, sa premi\xE8re action est \xAB rien \xBB et elle ne peut pas combattre au corps \xE0 corps. Le marqueur part si l'unit\xE9 qui agrippe est d\xE9truite ou fait autre chose que \xAB rien \xBB. (p.155)",Grenade:"Lance-grenades : l'infanterie touch\xE9e garde sa sauvegarde d'infanterie mais jamais de sauvegarde de couvert. Les v\xE9hicules gardent leur couvert. (p.155)","Half-Tracked":"Can be affected by type of Terrain crossed.","Head Shot":"Tir \xE0 la t\xEAte : voir la carte de l'unit\xE9.",Helicopter:"Helicopters are not required to take a Move Action as their first Action, allowing them to make Sustained Attacks Actions.","High Priest":"Can use the Get Moving You Monster and Close Wounds Special Actions on a Mythos Creature.",Huge:"Huge Vehicle Units occupy 4 squares. When they take any Move Action, perform the movement based on their leading edge. Move the leading edge a number of squares equal to the value of the Move Action, with the remainder of the Vehicle occupying the squares vacated by the leading edge during the final square of movement. When they move diagonally, the entire leading edge moves diagonally. They may rotate within the four squares they occupy either before or after their move. Like other Vehicle Units, they cannot move diagonally across the corner of a square occupied by impassable Terrain or an enemy Unit.","Improved Camouflage":"May take Improved Camouflage Special Action. Once it is Camouflaged, no enemy Unit at Range 2 or Higher has Line Of Sight to this Unit. This benefit ends if this Unit takes any Action other than a Move or Nothing Action (Artillery Observers can use their Skill to attack with an Artillery Unit as well). Starts the game Camouflaged. Not shared with Unit Joined.","Infantry Ace":"Roll one die when Unit Activates, gaining a third action for this Activation on a dice_block or a dice_sight result.","Inject Stimulants":"Action sp\xE9ciale de m\xE9decin : une unit\xE9 d'infanterie en ligne de vue \xE0 port\xE9e 1 (soi-m\xEAme inclus) re\xE7oit un marqueur Stimulants. \xC0 son activation, elle le retire et lance 1 d\xE9 : dice_block = choix d'un des deux effets ; dice_sight = une attaque compte comme soutenue ; dice_shield = un mouvement compte comme marche. Un effet donne 3 actions (jamais plus de 3). (p.147)",Interrogate:"If a Unit with this Skill or a Unit Joined uses a Close Combat weapon to eliminate a Hero or Officer, or Executes a Hero or Officer, roll four dice for Initiative at the start of each Turn for the rest of the game.",Jammer:"All successful enemy Actions using a radio within range 6 are forced to re-roll and accept the new result. Jammer also affects Attack Actions and Sustained Attack Actions triggered by Artillery Observers, causing them to re-roll successful dice.","Killing Spree":"When a Hero scores a Hit with a Ranged Weapon, roll another die scoring another hit on dice_block. Continue rolling until fail to hit. If the Hero has a rule that allows it to hit on dice_sight as well as dice_block, it only count dice_sight as a Hit for the first roll, and not the additional rolls generated by these Hits. Does not apply to Units Joined.",Large:"Large Vehicle Units occupy 2 squares. When they take any Move Action, perform the movement based on their leading edge. Move the leading edge a number of squares equal to the value of the Move Action, with the remainder of the Vehicle occupying the squares vacated by the leading edge during the final square of movement. When they move diagonally, the entire leading edge moves diagonally. Like other Vehicle Units, they cannot move diagonally across the corner of a square occupied by impassable Terrain or an enemy Unit.","Large Ordnance":"Grosse munition : vise un point dans l'arc de tir, \xE0 port\xE9e et en ligne de vue ; explosion de 2\xD72 carr\xE9s sur quadrillage (gabarit d'artillerie sans quadrillage). (Errata 02/2019)",Laser:"Arme laser : chaque touche fait relancer un d\xE9, nouvelle touche sur dice_block, jusqu'\xE0 un rat\xE9. En attaque soutenue, seuls les rat\xE9s du jet initial sont relanc\xE9s. (p.157 + FAQ)","Lesser Mythos Creatures":"Can never be the target of any Command Squad, Officer, or Medic Special Actions.",Loner:"May not Join a Unit.",Lucky:"Once per game, may re-roll any of the dice for any of their Weapons when making an Attack or Sustained Attack Action. Player does not need to declare the use of the Skill prior to making the original roll. Does not apply to Unit Joined.","Makeshift Repair":"Action sp\xE9ciale de m\xE9canicien : sur un v\xE9hicule en ligne de vue \xE0 port\xE9e 1 (pas le sien), lancer 5 d\xE9s ; chaque dice_block rend 1 point de vie. Utilisable depuis un v\xE9hicule terrestre, pas depuis un a\xE9ronef. (p.148)","Master Deceiver":"When this Hero is on the battlefield, all enemy successful roll for the Get Moving You Bunch Of Monkeys or Get Moving you Monster Special Actions must be rerolled. The new result is final.","Master Fighter":"This Hero hits on rolls of dice_sight as well as dice_block with all its Weapons. Applies to Unit Joined.",Mechanic:"May perform a Makeshift Repair Action. Can be used from a Ground Vehicle, but not on the Vehicle itself. Does not apply to Unit Joined.","Mechanic Crew":"Perform a Makeshift Repair Action to roll one die for each Miniature in the Unit. Cancel one point of damage on adjacent vehicle for each dice_block rolled. Does not apply to Units Joined.",Medevac:"Take a Medevac Action on a friendly Infantry Unit within Range 1. Roll a die for each Soldier eliminated from the Unit. Each roll of dice_block returns one Soldier to the Unit.",Medic:"Les m\xE9decins peuvent faire les actions sp\xE9ciales \xAB Get Up, It Ain't That Bad \xBB et \xAB Inject Stimulants \xBB. Utilisable depuis un v\xE9hicule terrestre, jamais depuis un a\xE9ronef.",Mercenary:"Unit can be fielded by any Bloc.",Mindless:"Mindless Zombies cannot take or hold Objectives but may contest them (applies to Unit Joined) and are Immune to Suppression (applies to Unit Joined). Mindless Zombies can be Joined by a Zombie Hero or a Hero equipped with a BlutKreuz.","Move And Fire":"May take free Move Action before or after a Sustained Attack Action using Ranged Weapons or a free Attack Action using Ranged Weapons before or after a March Move Action.","Mythos Creature":"Immune to Suppression and Critical Hits. It can never have a Pilot and can never be the target of any Command Squad, Officer, or Mechanic Special Actions. It can never Control an Objective but may contest it.","Naval Unit":"Treats Water as open Terrain but cannot enter any other type of Terrain. May take free Attack Action after performing a March Move Action. An eliminated Naval Unit becomes Water Terrain.","Nothin's Easy":"Any Unit joined by this Hero cannot gain Under fire or Suppression tokens.",Officer:"May take Officer Special Actions to reactivate or rearm their troops.",Phaser:"Arme phaser : aucune sauvegarde de couvert ; l'infanterie garde sa sauvegarde d'infanterie. (p.157)",Phosphorus:"Phosphore : voir la carte de l'unit\xE9.","Phosphorus Flame":"Flamme au phosphore : voir la carte de l'unit\xE9 et les r\xE8gles de lance-flammes.",Pilot:"May mount a Vehicle and use Skills while mounted.","Plasma Gun":"This weapon has two different lines for damage; apply the correct one depending on target range.","Poison Master":"Pr. Sum has poisoned the medical supplies of your opponent. As long as he's on the battlefield, your enemies can't use Get Up It Ain't That Bad Special Action.","Power Scopes":"Hits on dice_sight as well as dice_block when using Ranged weapons when making a Sustained Attack. Does not apply to Units Joined.","Psychic Choir":"Allows a High Priest to use its two Special Actions to be used on Mythos Creatures at a distance.","Psychic Scream":"Once per game, execute Psychic Scream Free Action to Attack all Units, friends or foes, in Range 3 radius. Ignores Line of Sight, Infantry and Cover Saves.","Psychic Vortex":"Once per game, execute Psychic Vortex Free Action to Attack all Units, friends or foes, in Range 2 radius. Ignores Line of Sight, Infantry and Cover Saves.","Quick Recovery":"Unit does not need to take a Nothing Action after using Airborne skill. It shares this skill with a Squad but not a Vehicle.",Radar:"A vehicle with this equipment can reroll once any failed dice when making an Attack or Sustained Attack Action against an Aircraft.",Radiation:"Radiation : la cible doit relancer ses sauvegardes r\xE9ussies ; ne b\xE9n\xE9ficie jamais de l'avantage de hauteur. (Errata)",Raid:"The Vehicle can spend all its Actions to do a Raid Special Action. It can do Move + Attack + Move in this Activation, but can't be reactivated for this turn.","Rail Weapon":"Arme \xE0 rail : voir la carte de l'unit\xE9.",Rally:"Action sp\xE9ciale d'officier : sans radio, toutes les unit\xE9s \xE0 port\xE9e 2 en ligne de vue ; avec radio, une seule unit\xE9 n'importe o\xF9. Pour chaque unit\xE9, 2 d\xE9s : 2 dice_block = tous les marqueurs retir\xE9s ; 1 seul = suppression \u2192 sous le feu, ou sous le feu retir\xE9. (p.146)","Red Banner":"All friendly Infantry Units within range 2 and in Line of Sight of the Unit possessing the Red Banner Skill roll three dice when Rallying.",Reload:"Arme \xE0 recharger : un marqueur \xAB charg\xE9 \xBB au d\xE9part, retir\xE9 \xE0 chaque tir. Une action sp\xE9ciale Recharge le remet (attaque + recharge possibles dans la m\xEAme activation). (p.158)",Resurrection:"May take Resurrection Special Action on a Mindless Zombie unit within range 1. Roll a die for each Zombie Soldier eliminated from the unit. Each dice_block returns one Zombie Soldier to the unit.","Rocket Pack":"Once per game gain Fly, Charge and double Move and March values.",Salvo:"Arme \x * { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
html, body, #root { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
body { font-family:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:12px; }
button { font:inherit; color:inherit; cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.4; }
select, input { font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
.wrap { max-width:1360px; margin:0 auto; padding:28px 24px 60px; }
h1 { margin:0; font-size:28px; letter-spacing:.22em; color:#fff; }
.sub { color:var(--dim); letter-spacing:.2em; font-size:10px; margin-top:6px; text-transform:uppercase; }
.badge { border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:10px; letter-spacing:.1em; color:#a1a1aa; background:var(--panel2); }
.badge.cy { color:#22d3ee; border-color:#155e75; } .badge.am { color:var(--amber); border-color:#78350f; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
.ptitle { font-size:10px; letter-spacing:.24em; color:#a1a1aa; font-weight:700; text-transform:uppercase; margin:0 0 14px; display:flex; justify-content:space-between; gap:10px; }
.ptitle span { letter-spacing:.04em; font-weight:400; color:var(--faint); text-transform:none; }
.lbl { font-size:10px; letter-spacing:.2em; color:var(--dim); margin:16px 0 8px; text-transform:uppercase; display:flex; justify-content:space-between; }
.grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; } .grid5 { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.opt { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:11px 12px; text-align:left; color:#a1a1aa; }
.opt b { display:block; color:#d4d4d8; font-size:13px; margin-bottom:4px; } .opt small { color:var(--faint); font-size:10px; }
.opt.on { background:#fafafa; color:#27272a; border-color:#fafafa; } .opt.on b { color:#09090b; } .opt.on small { color:#52525b; }
.opt.amber.on { background:var(--amber); border-color:var(--amber); color:#111; font-weight:700; }
.opt.center { text-align:center; padding:9px 6px; letter-spacing:.12em; }
.opt.dis { opacity:.45; }
.row { display:flex; gap:10px; align-items:center; } .between { justify-content:space-between; } .wrapx { flex-wrap:wrap; }
.btn { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 14px; letter-spacing:.14em; text-transform:uppercase; font-size:11px; color:#a1a1aa; }
.btn:hover:not(:disabled) { border-color:#52525b; color:#fff; }
.btn.primary { background:#fafafa; color:#09090b; border-color:#fafafa; font-weight:700; } .btn.primary:hover:not(:disabled){ background:#fff; color:#000; }
.btn.warn { border-color:#7f1d1d; color:#fca5a5; } .btn.small { padding:6px 9px; font-size:10px; letter-spacing:.08em; }
.btn.go { background:var(--green); border-color:var(--green); color:#04130d; font-weight:700; }
.card { border:1px solid var(--line); border-left:3px solid var(--bc,#666); border-radius:8px; padding:12px 14px; background:var(--panel2); }
.card .t { display:flex; justify-content:space-between; font-weight:700; color:#fff; margin-bottom:8px; gap:8px; }
.card .u { display:flex; justify-content:space-between; color:#a1a1aa; padding:2px 0; } .card .u i { color:var(--faint); font-style:normal; }
.card .f { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; display:flex; justify-content:space-between; color:var(--dim); } .card .f b { color:#fff; }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; }
.pill { font-size:10px; border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:#a1a1aa; }
.note { font-size:11px; color:#a1a1aa; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; line-height:1.5; }
.err { color:#fca5a5; font-size:11px; margin-top:6px; }
/* partie */
.game { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; padding:14px; min-height:100vh; align-items:start; align-content:start; }
.topbar { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.boardwrap { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; justify-content:center; overflow:hidden; }
.side { display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 80px); overflow:auto; position:sticky; top:14px; }
.log { font-size:11px; line-height:1.55; color:#a1a1aa; max-height:220px; overflow:auto; } .log div.turn { color:#fff; margin-top:6px; } .log div.react { color:#fbbf24; }
.ucard h3 { margin:0 0 4px; color:#fff; font-size:14px; } .ucard .sb { color:var(--dim); font-size:10px; margin-bottom:8px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; } .stat { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 6px; text-align:center; } .stat b { display:block; color:#fff; font-size:14px; } .stat small { color:var(--faint); font-size:9px; letter-spacing:.1em; }
.weap { border-top:1px solid var(--line); padding:6px 0; color:#a1a1aa; display:flex; justify-content:space-between; gap:8px; } .weap b { color:#e4e4e7; }
.sk { display:inline-block; margin:2px 4px 2px 0; border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:#a1a1aa; cursor:help; }
.plans { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .plans .btn { text-align:left; letter-spacing:.04em; text-transform:none; font-size:11px; }
.plans .btn small { display:block; color:var(--amber); font-size:9px; margin-top:2px; }
.prompt { border:1px solid #14532d; background:#052e1a; color:#bbf7d0; border-radius:8px; padding:10px 12px; line-height:1.5; }
.prompt.red { border-color:#7f1d1d; background:#2a0d0d; color:#fecaca; }
.ulist .ur { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; cursor:pointer; border:1px solid transparent; } .ulist .ur:hover { background:var(--panel2); } .ulist .ur.sel { border-color:#52525b; background:var(--panel2); } .ulist .ur.done { opacity:.45; } .ulist .ur.dead { opacity:.3; text-decoration:line-through; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.66); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal .box { width:min(520px,100%); background:var(--panel); border:1px solid #52525b; border-radius:12px; padding:22px; box-shadow:0 20px 80px rgba(0,0,0,.7); }
.modal h2 { margin:0 0 10px; font-size:15px; letter-spacing:.14em; color:#fff; text-transform:uppercase; }
.die { display:inline-flex; width:34px; height:34px; border-radius:7px; border:1px solid #52525b; align-items:center; justify-content:center; margin-right:6px; font-weight:700; background:var(--panel2); } .die.hit { background:#fafafa; color:#09090b; }
.hp { height:5px; background:#27272a; border-radius:3px; overflow:hidden; margin-top:4px; } .hp i { display:block; height:100%; background:var(--green); }
@media (max-width:1050px) { .game { grid-template-columns:1fr; } .side { position:static; max-height:none; } .grid4 { grid-template-columns:repeat(2,1fr); } .grid2 { grid-template-columns:1fr; } }

/* simulation IA : param\xE8tres + liste des unit\xE9s restent en haut du panneau lat\xE9ral */
.simdock { order:-10; position:sticky; top:0; z-index:5; background:var(--bg); display:flex; flex-direction:column; gap:12px; padding-bottom:4px; }
.simdock .ulist { max-height:calc(100vh - 230px); overflow:auto; }
